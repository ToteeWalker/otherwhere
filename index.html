<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#03061a">
<title>OTHERWHERE — a universe beyond our own</title>
<link rel="preload" as="image" href="assets/bg-portrait.jpg" media="(orientation: portrait)">
<link rel="preload" as="image" href="assets/bg.jpg" media="(orientation: landscape)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ฟอนต์สำรอง กรณี Adobe Fonts โหลดไม่ขึ้น -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<!-- Adobe Fonts kit: helvetica-neue-world (ไทย) + courier-new (อังกฤษ) -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/vzh8ghc.css">
<script src="config.js"></script>
<style>
  :root{
    --ink:#d5e3ff;            /* สีตัวอักษรหลัก (ฟ้าอ่อนตามตัวอย่าง) */
    --ink-dim:rgba(213,227,255,.62);
    --blue:#1233b8;           /* ตัวอักษรบนปุ่มขาว */
    --orb:#1c0aa8;            /* วงกลมเลขมิติ */
    --line:rgba(213,227,255,.22);
    --bg-x:50%;               /* เลื่อนจุดโฟกัสภาพพื้นหลัง (แนวนอน) */
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --en:"courier-new","Courier New","Courier Prime",Courier,monospace;
    --th:"helvetica-neue-world","Noto Sans Thai",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#03061a;color:var(--ink);overscroll-behavior:none}
  /* อักษรอังกฤษ/ตัวเลข = courier-new, อักษรไทยตกไปที่ฟอนต์ไทยเองอัตโนมัติ */
  body{font-family:var(--en),var(--th);font-weight:400;font-style:normal}
  .th{font-family:var(--th);font-weight:300}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

  /* ---------- background ---------- */
  .bg{position:fixed;inset:0;z-index:0;background:#03061a url(assets/bg-portrait.jpg) var(--bg-x) center/cover no-repeat}
  @media (orientation:landscape){ .bg{background-image:url(assets/bg.jpg)} }
  .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(3,6,26,.55) 0%,rgba(3,6,26,.25) 30%,rgba(3,6,26,.35) 60%,rgba(3,6,26,.8) 100%)}
  body.dim .bg::after{background:rgba(3,6,26,.62)}
  #sky{position:fixed;inset:0;z-index:1;pointer-events:none}

  .view{position:relative;z-index:2;min-height:100dvh;display:none;flex-direction:column;align-items:center;
    padding:calc(22px + var(--safe-t)) 24px calc(30px + var(--safe-b));max-width:520px;margin:0 auto}
  .view.on{display:flex;animation:fade .5s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .demo-tag{position:fixed;top:calc(8px + var(--safe-t));left:10px;z-index:50;font:11px var(--en);letter-spacing:.12em;
    color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:rgba(0,0,0,.35)}

  /* ---------- buttons ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:min(240px,64vw);min-height:54px;border-radius:8px;
    background:#fff;color:var(--blue);font-family:var(--th);font-weight:300;font-size:21px;
    box-shadow:0 10px 40px -12px rgba(150,175,255,.55);transition:transform .15s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn.small{font-size:18px;min-height:50px}
  .link{margin-top:16px;font-family:var(--th);font-weight:300;font-size:15px;color:var(--ink-dim);
    text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line);padding:6px}
  .bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}

  .logo-s{display:block;width:118px;height:auto;margin:0 auto}
  .logo-s img{width:100%;display:block}

  /* ---------- start ---------- */
  #start .logo-l{margin-top:16vh;width:min(330px,82vw)}
  #start .logo-l img{width:100%;display:block;filter:drop-shadow(0 0 30px rgba(120,150,255,.35))}

  /* ---------- intro ---------- */
  #intro .copy{margin:auto 0;text-align:center;font-family:var(--en),var(--th);font-weight:300;font-size:17px;line-height:1.85;
    max-width:24em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  #intro .copy .th{font-weight:300}

  /* ---------- draw ---------- */
  #draw{gap:14px}
  .counter{font-family:var(--en),var(--th);font-size:15px;letter-spacing:.02em;color:var(--ink);margin-top:6px}
  .counter .th{font-weight:300}
  .pad-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:calc(100dvh - 330px - var(--safe-t) - var(--safe-b));
    min-width:250px;margin:4px auto 0}
  #pad{width:100%;height:100%;display:block;border-radius:6px;touch-action:none;
    background:rgba(8,14,52,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 0 0 1px var(--line) inset,0 24px 60px -24px rgba(0,0,0,.9)}
  .pad-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink-dim);
    font-family:var(--th);font-weight:300;font-size:16px;text-align:center;line-height:1.75;transition:opacity .4s}
  .pad-hint.gone{opacity:0}
  .tools{display:flex;align-items:center;justify-content:space-between;width:100%;
    max-width:calc(100dvh - 330px - var(--safe-t) - var(--safe-b));min-width:250px;margin-top:-4px}
  .tbtn{width:44px;height:44px;display:grid;place-items:center;color:#fff;margin:0 -8px}
  .tbtn svg{width:26px;height:26px}
  .tbtn[disabled]{opacity:.3;pointer-events:none}

  /* ---------- after transform ---------- */
  .fly{position:fixed;z-index:60;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,255,255,.8))}
  .flystar{position:fixed;z-index:61;width:14px;height:14px;border-radius:50%;pointer-events:none;
    background:#fff;box-shadow:0 0 12px 4px #fff,0 0 40px 14px rgba(160,185,255,.9)}
  #result{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;
    text-align:center;padding:calc(22px + var(--safe-t)) 26px calc(30px + var(--safe-b));overflow:hidden}
  #result::before{content:"";position:absolute;inset:-40px;z-index:-1;background:inherit;
    background:#03061a url(assets/bg-portrait.jpg) var(--bg-x) center/cover no-repeat;filter:blur(18px) brightness(.75)}
  @media (orientation:landscape){ #result::before{background-image:url(assets/bg.jpg)} }
  #result::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(3,6,26,.35)}
  #result.on{display:flex;animation:fade .7s ease both}
  #result .mid{margin:auto 0;display:flex;flex-direction:column;align-items:center}
  #result .big{font-family:var(--en);font-size:76px;line-height:1;letter-spacing:-.02em;color:#fff;
    text-shadow:0 0 34px rgba(170,195,255,.6)}
  #result h2{font-family:var(--th);font-weight:300;font-size:21px;line-height:1.6;margin:26px 0 0;max-width:13em}
  #result p{font-family:var(--en),var(--th);font-weight:300;font-size:13px;color:var(--ink-dim);line-height:1.7;margin:14px 0 0;max-width:20em}
  #result .bottom{margin-top:0;gap:12px}

  /* ---------- star storage ---------- */
  .topbar{display:flex;align-items:center;gap:6px;width:100%;min-height:46px;margin-bottom:14px}
  .back{width:40px;height:44px;display:grid;place-items:center;margin-left:-10px;color:#fff}
  .back svg{width:22px;height:22px}
  .topbar .title{flex:1;font-family:var(--en),var(--th);font-weight:400;font-size:20px}
  .topbar .title .th{font-weight:300}
  .topbar .logo-s{width:84px;margin:0}
  .list{display:flex;flex-direction:column;gap:12px;width:100%}
  .uni{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px 12px 12px;border-radius:8px;background:#fff;
    color:var(--blue);width:100%;box-shadow:0 10px 30px -16px rgba(0,0,0,.8)}
  .uni:active{transform:scale(.985)}
  .uni .orb{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--en);
    font-size:26px;color:#fff;background:var(--orb)}
  .uni.done .orb{background:radial-gradient(circle,#000 42%,#16104a 70%,#2b2390);box-shadow:0 0 14px -2px #3b2fd0}
  .uni .meta{flex:1;min-width:0;line-height:1.45}
  .uni .meta .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .uni .meta b{font-family:var(--en),var(--th);font-weight:400;font-size:18px}
  .uni .meta .when{font-family:var(--en),var(--th);font-weight:300;font-size:13px;color:#3a4fae;white-space:nowrap}
  .tag{font-family:var(--th);font-weight:300;font-size:11px;text-align:right;white-space:nowrap;color:var(--blue)}
  .tag.done{color:#8a93b8}
  .sub{font-family:var(--en),var(--th);font-weight:300;color:var(--ink-dim);font-size:14px;width:100%;margin:-6px 0 4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;width:100%;margin-top:8px}
  .tile{position:relative;aspect-ratio:1;border-radius:6px;background:rgba(8,14,52,.5);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
  .tile img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
  .tile span{position:absolute;left:8px;top:6px;font:11px var(--en);color:var(--ink-dim)}
  .empty{font-family:var(--th);font-weight:300;color:var(--ink-dim);text-align:center;margin-top:26vh;line-height:1.8;width:100%}
  #lightbox{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(3,6,26,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:24px}
  #lightbox.on{display:flex;animation:fade .3s both}
  #lightbox img{width:min(86vw,60vh);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 14px rgba(255,255,255,.5))}
  #lightbox p{font-family:var(--en),var(--th);font-weight:300;color:var(--ink-dim);margin-top:18px;font-size:14px}

  #toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);z-index:80;opacity:0;
    background:#fff;color:var(--blue);font-family:var(--th);padding:12px 18px;border-radius:8px;font-size:15px;transition:.3s;
    max-width:90vw;text-align:center;pointer-events:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(18,51,184,.2);border-top-color:var(--blue);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="sky"></canvas>
<div id="demoTag" class="demo-tag" hidden>DEMO</div>

<!-- ================= START ================= -->
<section id="start" class="view">
  <div class="logo-l"><img src="assets/logo.png" alt="OTHERWHERE — a universe beyond our own"></div>
  <div class="bottom">
    <button class="btn" data-go="#/intro">เริ่ม</button>
    <button class="link" data-go="#/archive">อ่านดาวที่ผ่านมา</button>
  </div>
</section>

<!-- ================= INTRO ================= -->
<section id="intro" class="view">
  <a class="logo-s" href="#/"><img src="assets/logo.png" alt="OTHERWHERE"></a>
  <p class="copy">ยินดีต้อนรับสู่ No Name พื้นที่ ที่จะทำให้<br>จินตนาการและข้อความของคุณไปสู่ดวงดาว</p>
  <div class="bottom" style="margin-top:0">
    <button class="btn" data-go="#/draw">ถัดไป</button>
  </div>
</section>

<!-- ================= DRAW ================= -->
<section id="draw" class="view">
  <a class="logo-s" href="#/"><img src="assets/logo.png" alt="OTHERWHERE"></a>
  <div class="counter" id="drawTitle">&nbsp;</div>
  <div class="pad-wrap">
    <canvas id="pad"></canvas>
    <div class="pad-hint" id="padHint">ใช้นิ้ววาดหรือเขียน<br>อะไรก็ได้ตรงนี้</div>
  </div>
  <div class="tools">
    <button class="tbtn" id="undoBtn" aria-label="ย้อนกลับ" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5 4 9l4 4"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tbtn" id="clearBtn" aria-label="ล้าง" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M9 6V4h6v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 10v8M14 10v8"/></svg></button>
  </div>
  <div class="bottom">
    <button class="btn" id="sendBtn" disabled>ส่ง</button>
  </div>
</section>

<!-- ================= AFTER TRANSFORM ================= -->
<div id="result">
  <div class="mid">
    <div class="big" id="resBig"></div>
    <h2 id="resTitle"></h2>
    <p id="resText"></p>
  </div>
  <div class="bottom">
    <button class="btn small" id="againBtn">วาดอีกครั้ง</button>
    <button class="btn small" data-go="#/archive">อ่านดาวที่ผ่านมา</button>
  </div>
</div>

<!-- ================= STAR STORAGE ================= -->
<section id="archive" class="view">
  <div class="topbar">
    <button class="back" data-go="#/" aria-label="กลับ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
    <div class="title"><span class="th">ดาวที่ผ่านมา</span></div>
  </div>
  <div class="list" id="uniList"></div>
</section>

<section id="universe" class="view">
  <div class="topbar">
    <button class="back" data-go="#/archive" aria-label="กลับ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
    <div class="title" id="uniTitle"></div>
  </div>
  <div class="sub" id="uniSub"></div>
  <div class="grid" id="uniGrid"></div>
</section>

<div id="lightbox"><img alt=""><p></p></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const CFG  = window.STAR_CONFIG || {};
const URL_ = (CFG.SUPABASE_URL || '').replace(/\/+$/, '');
const KEY  = CFG.SUPABASE_KEY || '';
const DEMO = !URL_ || !KEY;
const INK = '#ffffff';          // ใช้สีขาวสีเดียว
const BRUSH = 0.022;            // ขนาดเส้นคงที่ (สัดส่วนของ canvas)
const $ = s => document.querySelector(s);

/* ---------------- storage (safe) ---------------- */
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch { mem[k] = v; } },
};
let clientId = store.get('su_client');
if (!clientId) {
  clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  store.set('su_client', clientId);
}

/* ---------------- API ---------------- */
async function rpc(fn, args = {}) {
  if (DEMO) return Demo[fn](args);
  const headers = { 'Content-Type': 'application/json', apikey: KEY };
  if (KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + KEY; // legacy anon key
  const r = await fetch(`${URL_}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  const text = await r.text();
  if (!r.ok) {
    let msg = text; try { msg = JSON.parse(text).message || text; } catch {}
    throw new Error(msg);
  }
  return text ? JSON.parse(text) : null;
}

/* ---------------- twinkle layer over BG ---------------- */
const sky = $('#sky'), sctx = sky.getContext('2d');
let skyStars = [];
function sizeSky(){
  const d = Math.min(devicePixelRatio || 1, 2);
  sky.width = innerWidth * d; sky.height = innerHeight * d;
  sctx.setTransform(d,0,0,d,0,0);
  const n = Math.round(innerWidth * innerHeight / 9000);
  skyStars = Array.from({length:n}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:Math.random()*1+.2, p:Math.random()*6.28, s:Math.random()*.7+.2}));
}
function drawSky(t){
  sctx.clearRect(0,0,innerWidth,innerHeight);
  sctx.fillStyle = '#e6edff';
  for (const s of skyStars){
    sctx.globalAlpha = .1 + .6 * (.5 + .5*Math.sin(t/1000*s.s + s.p));
    sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill();
  }
  sctx.globalAlpha = 1;
  requestAnimationFrame(drawSky);
}
addEventListener('resize', sizeSky); sizeSky(); requestAnimationFrame(drawSky);

/* ---------------- toast ---------------- */
let toastT;
function toast(msg, ms = 2800){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms);
}

/* ---------------- router ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) location.hash = b.dataset.go;
});
function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  document.body.classList.toggle('dim', id === 'archive' || id === 'universe');
  window.scrollTo(0,0);
}
function route(){
  const h = location.hash || '#/';
  $('#result').classList.remove('on'); $('#lightbox').classList.remove('on');
  let m;
  if (h === '#/intro') show('intro');
  else if (h === '#/draw') { show('draw'); enterDraw(); }
  else if (h === '#/archive') { show('archive'); loadArchive(); }
  else if ((m = h.match(/^#\/u\/(\d+)$/))) { show('universe'); loadUniverse(+m[1]); }
  else show('start');
}
addEventListener('hashchange', route);

let state = null;
async function refreshState(){
  try { state = await rpc('get_state'); } catch (e) { console.warn(e); }
  return state;
}

/* ---------------- drawing pad ---------------- */
const pad = $('#pad'), pctx = pad.getContext('2d');
const base = document.createElement('canvas'), bctx = base.getContext('2d'); // committed strokes
let strokes = [], cur = null, dirty = false, sending = false;

$('#undoBtn').addEventListener('click', () => { strokes.pop(); renderBase(); });
$('#clearBtn').addEventListener('click', () => { strokes = []; renderBase(); });

function sizePad(){
  const r = pad.getBoundingClientRect(); if (!r.width) return;
  const d = Math.min(devicePixelRatio || 1, 3);
  pad.width = base.width = Math.round(r.width * d);
  pad.height = base.height = Math.round(r.height * d);
  renderBase();
}
new ResizeObserver(sizePad).observe(pad);

// draw one stroke (points normalized 0..1) onto ctx of pixel size S
function pathStroke(ctx, st, S){
  const p = st.pts;
  ctx.strokeStyle = st.c; ctx.fillStyle = st.c;
  ctx.lineWidth = st.w * S; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0]*S, p[0][1]*S, st.w*S/2, 0, 6.283); ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(p[0][0]*S, p[0][1]*S);
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i][0] + p[i+1][0]) / 2, my = (p[i][1] + p[i+1][1]) / 2;
    ctx.quadraticCurveTo(p[i][0]*S, p[i][1]*S, mx*S, my*S);
  }
  const l = p[p.length-1]; ctx.lineTo(l[0]*S, l[1]*S); ctx.stroke();
}
function glowStroke(ctx, st, S){
  ctx.save(); ctx.shadowColor = 'rgba(170,195,255,.9)'; ctx.shadowBlur = S * 0.025; pathStroke(ctx, st, S); ctx.restore();
}
function renderBase(){
  bctx.clearRect(0,0,base.width,base.height);
  for (const st of strokes) glowStroke(bctx, st, base.width);
  dirty = true; updateUI();
}
function frame(){
  if (dirty) {
    pctx.clearRect(0,0,pad.width,pad.height);
    pctx.drawImage(base, 0, 0);
    if (cur) glowStroke(pctx, cur, pad.width);
    dirty = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function inkLength(){
  let L = 0;
  for (const st of strokes) { L += st.w; for (let i=1;i<st.pts.length;i++) L += Math.hypot(st.pts[i][0]-st.pts[i-1][0], st.pts[i][1]-st.pts[i-1][1]); }
  return L;
}
function updateUI(){
  $('#sendBtn').disabled = sending || inkLength() < 0.08;
  $('#undoBtn').disabled = $('#clearBtn').disabled = sending || !strokes.length;
  $('#padHint').classList.toggle('gone', strokes.length > 0 || !!cur);
}

// typing signal -> TouchDesigner (Phase 2)
let lastPing = 0;
function pingTyping(){
  const now = Date.now(); if (now - lastPing < 2500) return;
  lastPing = now; rpc('ping_typing').catch(() => {});
}

let activeId = null;
function ptr(e){ const r = pad.getBoundingClientRect(); return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height]; }
pad.addEventListener('pointerdown', e => {
  if (activeId !== null || sending) return;
  activeId = e.pointerId; pad.setPointerCapture(e.pointerId);
  cur = { c: INK, w: BRUSH, pts: [ptr(e)] };
  dirty = true; updateUI(); pingTyping();
});
pad.addEventListener('pointermove', e => {
  if (e.pointerId !== activeId || !cur) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) {
    const p = ptr(ev), q = cur.pts[cur.pts.length-1];
    if (Math.hypot(p[0]-q[0], p[1]-q[1]) > 0.002) cur.pts.push(p);
  }
  dirty = true; pingTyping();
});
function endStroke(e){
  if (e.pointerId !== activeId) return;
  activeId = null;
  if (cur) { strokes.push(cur); cur = null; renderBase(); }
}
pad.addEventListener('pointerup', endStroke);
pad.addEventListener('pointercancel', endStroke);

// export: crop to drawing, fit into 512x512 transparent PNG, no glow (ให้ TD ใส่ glow เอง)
function exportPNG(list = strokes, OUT = 512){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const st of list) for (const [x,y] of st.pts) {
    x0=Math.min(x0,x-st.w/2); y0=Math.min(y0,y-st.w/2); x1=Math.max(x1,x+st.w/2); y1=Math.max(y1,y+st.w/2);
  }
  const w = x1-x0, h = y1-y0, scale = Math.min(OUT*0.88/Math.max(w,h,1e-6), OUT*3);
  const c = document.createElement('canvas'); c.width = c.height = OUT;
  const ctx = c.getContext('2d');
  ctx.translate(OUT/2 - (x0+w/2)*scale, OUT/2 - (y0+h/2)*scale);
  for (const st of list) pathStroke(ctx, st, scale);
  return c.toDataURL('image/png');
}

/* ---------------- cooldown ---------------- */
function cooldownLeft(){
  const last = +store.get('su_last') || 0, cd = (state && state.cooldown_seconds) || 0;
  return Math.max(0, Math.ceil((last + cd*1000 - Date.now())/1000));
}

async function enterDraw(){
  requestAnimationFrame(sizePad);
  const s = await refreshState();
  $('#drawTitle').innerHTML = s
    ? `<span class="th">ดาวดวงที่</span> ${s.star_count + 1} / ${s.star_target} &nbsp;<span class="th">มิติที่</span> ${s.current_universe}`
    : '<span class="th">ดาวดวงใหม่</span>';
}
setInterval(() => { if ($('#draw').classList.contains('on') && !sending) enterDraw(); }, 8000);

$('#sendBtn').addEventListener('click', async () => {
  if (sending || !strokes.length) return;
  const left = cooldownLeft();
  if (left > 0) { toast(`รออีก ${left} วินาที ก่อนส่งดาวดวงใหม่นะ`); return; }
  sending = true; updateUI();
  const btn = $('#sendBtn'); btn.innerHTML = '<span class="spin"></span>';
  const dataUrl = exportPNG();
  try {
    const res = await rpc('submit_star', { p_image: dataUrl.split(',')[1], p_color: INK, p_client_id: clientId });
    store.set('su_last', Date.now());
    await flyAway();
    strokes = []; renderBase();
    showResult(res);
  } catch (e) {
    const m = String(e.message || e).match(/COOLDOWN:(\d+)/);
    if (m) { store.set('su_last', Date.now() - ((state?.cooldown_seconds||30) - +m[1])*1000); toast(`รออีก ${m[1]} วินาที ก่อนส่งดาวดวงใหม่นะ`); }
    else { console.error(e); toast('ส่งไม่สำเร็จ ลองใหม่อีกครั้งนะ'); }
  } finally {
    sending = false; btn.textContent = 'ส่ง'; updateUI();
  }
});

// the drawing shrinks into a star and flies up (mirrors what happens on the big screen)
function flyAway(){
  return new Promise(resolve => {
    const r = pad.getBoundingClientRect();
    const img = document.createElement('canvas'); img.width = pad.width; img.height = pad.height;
    img.getContext('2d').drawImage(base, 0, 0);
    Object.assign(img.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
    img.className = 'fly'; document.body.appendChild(img);
    pctx.clearRect(0,0,pad.width,pad.height); bctx.clearRect(0,0,base.width,base.height);
    const a1 = img.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.04)',opacity:.9}],
      {duration:900,easing:'cubic-bezier(.6,0,.3,1)',fill:'forwards'});
    a1.onfinish = () => {
      img.remove();
      const s = document.createElement('div'); s.className = 'flystar';
      s.style.left = (r.left + r.width/2 - 7) + 'px'; s.style.top = (r.top + r.height/2 - 7) + 'px';
      document.body.appendChild(s);
      const a2 = s.animate([{transform:'translateY(0) scale(1)',opacity:1},{transform:`translateY(${-r.top-r.height/2-40}px) scale(.4)`,opacity:0}],
        {duration:1100,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'});
      a2.onfinish = () => { s.remove(); resolve(); };
    };
  });
}

let cdTimer;
function showResult(res){
  $('#resBig').textContent = `${res.star_index}/${res.star_target}`;
  if (res.is_last) {
    $('#resTitle').innerHTML = 'คุณคือดาวดวงสุดท้าย<br>ของมิตินี้';
    $('#resText').innerHTML = `ภารกิจของมิติที่ ${res.universe_id} สำเร็จแล้ว<br>มองไปที่จอสิ อีกไม่นานจะเกิดปรากฏการณ์ GENESIS<br>แล้วมิติใหม่จะกำเนิดขึ้น ✦`;
  } else {
    $('#resTitle').innerHTML = 'ข้อความของคุณกำลัง<br>ถูกเปลี่ยนเป็นดวงดาว';
    $('#resText').innerHTML = `ดวงที่ ${res.star_index} ของมิติที่ ${res.universe_id} มอง<br>ไปที่มิติสิ ✦`;
  }
  $('#result').classList.add('on');
  const btn = $('#againBtn');
  clearInterval(cdTimer);
  const tick = () => {
    const left = cooldownLeft();
    btn.disabled = left > 0;
    btn.textContent = left > 0 ? `วาดอีกครั้งได้ใน ${left} วิ` : 'วาดอีกครั้ง';
    if (!left) clearInterval(cdTimer);
  };
  tick(); cdTimer = setInterval(tick, 500);
}
$('#againBtn').addEventListener('click', () => { $('#result').classList.remove('on'); enterDraw(); });

/* ---------------- star storage ---------------- */
const fmtD = d => new Date(d).toLocaleDateString('th-TH', {day:'numeric', month:'short'});
const fmtT = d => new Date(d).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadArchive(){
  const el = $('#uniList'); el.innerHTML = '<div class="empty">กำลังโหลด…</div>';
  try {
    const list = await rpc('list_universes');
    if (!list.length) { el.innerHTML = '<div class="empty">ยังไม่มีดาวเลย<br>มาเป็นดาวดวงแรกกัน ✦</div>'; return; }
    el.innerHTML = list.map(u => `
      <button class="uni ${u.complete ? 'done' : ''}" data-go="#/u/${u.universe_id}">
        <div class="orb">${u.universe_id}</div>
        <div class="meta">
          <div class="row"><b>มิติที่ ${u.universe_id}</b>
            <span class="tag ${u.complete ? 'done' : ''}">${u.complete ? 'ถูกหลุมดำกลืนแล้ว' : 'กำลังก่อตัว'}</span></div>
          <div class="when">${u.stars} ดวง · ${fmtD(u.started_at)} ${fmtT(u.started_at)}–${fmtT(u.ended_at)}</div></div>
      </button>`).join('');
  } catch (e) { console.error(e); el.innerHTML = '<div class="empty">โหลดไม่สำเร็จ ลองใหม่อีกครั้ง</div>'; }
}

let uniStars = [];
async function loadUniverse(n){
  $('#uniTitle').textContent = `มิติที่ ${n}`;
  $('#uniSub').textContent = ''; const g = $('#uniGrid'); g.innerHTML = '';
  try {
    uniStars = await rpc('get_universe_stars', { p_universe: n });
    $('#uniSub').textContent = `${uniStars.length} ดวง · แตะเพื่อดูใกล้ๆ`;
    g.innerHTML = uniStars.map((s,i) => `
      <button class="tile" data-i="${i}"><span>#${s.star_index}</span>
        <img loading="lazy" alt="ดาวดวงที่ ${s.star_index}" src="data:image/png;base64,${esc(s.image)}"></button>`).join('');
  } catch (e) { console.error(e); g.innerHTML = '<div class="empty">โหลดไม่สำเร็จ</div>'; }
}
$('#uniGrid').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const s = uniStars[+t.dataset.i], lb = $('#lightbox');
  lb.querySelector('img').src = 'data:image/png;base64,' + s.image;
  lb.querySelector('p').textContent = `ดาวดวงที่ ${s.star_index} · ${fmtD(s.created_at)} ${fmtT(s.created_at)}`;
  lb.classList.add('on');
});
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('on'));

/* ---------------- DEMO backend (ใช้เมื่อยังไม่ใส่ config) ---------------- */
const Demo = (() => {
  const st = { current_universe: 1, star_count: 0, star_target: 10, cooldown_seconds: 5 };
  const stars = []; let id = 0;
  const wait = v => new Promise(r => setTimeout(() => r(v), 250));
  function scribble(seed){
    let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const list = [];
    for (let k = 0, n = 1 + Math.floor(rnd()*3); k < n; k++) {
      const pts = []; let x = .3+rnd()*.4, y = .3+rnd()*.4, a = rnd()*6.28;
      for (let i = 0; i < 40; i++) { a += (rnd()-.5)*.9; x += Math.cos(a)*.02; y += Math.sin(a)*.02; pts.push([x,y]); }
      list.push({ c: INK, w: BRUSH, pts });
    }
    return exportPNG(list, 256).split(',')[1];
  }
  function add(image, client){
    const now = new Date(Date.now() - (60 - id) * 60000).toISOString();
    const row = { id: ++id, universe_id: st.current_universe, star_index: st.star_count + 1, color: INK, image, client, created_at: now };
    stars.push(row);
    if (row.star_index >= st.star_target) { st.current_universe++; st.star_count = 0; } else st.star_count++;
    return row;
  }
  for (let i = 0; i < 13; i++) add(scribble(i+1), 'seed');
  return {
    get_state: () => wait({ ...st }),
    ping_typing: () => wait(null),
    submit_star({ p_image, p_client_id }){
      const last = stars.filter(s => s.client === p_client_id).pop();
      if (last && Date.now() - Date.parse(last.created_at) < st.cooldown_seconds*1000)
        return Promise.reject(new Error('COOLDOWN:' + Math.ceil((Date.parse(last.created_at) + st.cooldown_seconds*1000 - Date.now())/1000)));
      const target = st.star_target, r = add(p_image, p_client_id);
      r.created_at = new Date().toISOString();
      return wait({ id: r.id, universe_id: r.universe_id, star_index: r.star_index, star_target: target, is_last: r.star_index >= target });
    },
    list_universes(){
      const by = {};
      for (const s of stars) (by[s.universe_id] ||= []).push(s);
      return wait(Object.keys(by).map(Number).sort((a,b) => b-a).map(u => ({
        universe_id: u, stars: by[u].length, started_at: by[u][0].created_at,
        ended_at: by[u][by[u].length-1].created_at, complete: u < st.current_universe })));
    },
    get_universe_stars: ({ p_universe }) => wait(stars.filter(s => s.universe_id === p_universe)),
  };
})();
if (DEMO) $('#demoTag').hidden = false;

route();
})();
