<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<title>Star Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --bg0:#04050d; --bg1:#0a0f2a; --ink:#e8ebff; --dim:#8f96c4; --faint:#3a4070;
    --gold:#ffd98a; --gold-glow:rgba(255,217,138,.45); --line:rgba(160,170,255,.16);
    --card:rgba(18,24,60,.55);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);
    font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-weight:400;overscroll-behavior:none}
  body{background:radial-gradient(120% 80% at 50% 0%,#141a48 0%,var(--bg1) 35%,var(--bg0) 100%) fixed}
  h1,h2,h3,.display{font-family:"Mitr","IBM Plex Sans Thai",sans-serif;font-weight:400;margin:0}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  .view{position:relative;z-index:1;min-height:100dvh;display:none;flex-direction:column;
    padding:calc(16px + var(--safe-t)) 18px calc(18px + var(--safe-b));max-width:560px;margin:0 auto}
  .view.on{display:flex}
  .demo-tag{position:fixed;top:calc(8px + var(--safe-t));right:10px;z-index:5;font-size:11px;letter-spacing:.08em;
    color:var(--gold);border:1px solid var(--gold-glow);border-radius:99px;padding:2px 9px;background:rgba(0,0,0,.4)}

  /* ---------- buttons ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:999px;
    font-family:"Mitr",sans-serif;font-size:18px;letter-spacing:.01em;transition:transform .15s,opacity .2s,box-shadow .3s}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn-primary{background:linear-gradient(180deg,#ffe7b3,#f3c46a);color:#21170a;
    box-shadow:0 0 0 1px rgba(255,230,170,.6) inset,0 8px 40px -6px var(--gold-glow)}
  .btn-ghost{border:1px solid var(--line);background:rgba(20,26,70,.35);backdrop-filter:blur(6px)}
  .topbar{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:6px}
  .back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--dim)}
  .topbar .title{flex:1;font-family:"Mitr";font-size:17px;color:var(--dim)}
  .topbar .title b{color:var(--ink);font-weight:400}

  /* ---------- home ---------- */
  #home{justify-content:space-between;text-align:center}
  .hero{margin-top:12vh}
  .hero .spark{font-size:30px;color:var(--gold);text-shadow:0 0 18px var(--gold)}
  .hero h1{font-size:44px;line-height:1.05;margin-top:10px;letter-spacing:.01em}
  .hero p{color:var(--dim);font-size:16px;line-height:1.65;margin:16px auto 0;max-width:20em}
  .status{margin:34px auto 0}
  .status .label{font-size:14px;color:var(--dim);margin-bottom:12px}
  .status .label b{color:var(--ink);font-weight:500}
  .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:270px;margin:0 auto}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
  .dots i.lit{background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .actions{display:flex;flex-direction:column;gap:12px;margin-top:40px}

  /* ---------- draw ---------- */
  #draw{gap:12px}
  .pad-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:calc(100dvh - 300px - var(--safe-t) - var(--safe-b));
    min-width:240px;margin:0 auto;align-self:center}
  #pad{width:100%;height:100%;display:block;border-radius:28px;touch-action:none;
    background:radial-gradient(closest-side,rgba(40,50,120,.35),rgba(10,14,40,.6));
    box-shadow:0 0 0 1px var(--line) inset,0 20px 60px -20px rgba(0,0,0,.8)}
  .pad-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--dim);
    font-size:15px;text-align:center;line-height:1.7;transition:opacity .4s}
  .pad-hint.gone{opacity:0}
  .tools{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .swatches{display:flex;gap:8px}
  .sw{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px transparent,0 0 0 1px rgba(255,255,255,.15) inset;transition:box-shadow .2s,transform .2s}
  .sw.on{box-shadow:0 0 0 2px var(--bg0),0 0 0 4px currentColor;transform:scale(1.08)}
  .tool-btns{display:flex;gap:4px}
  .tbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:18px}
  .tbtn.on{color:var(--ink);background:rgba(255,255,255,.08)}
  .tbtn svg{width:20px;height:20px}
  .send-row{margin-top:auto}

  /* ---------- result overlay ---------- */
  .fly{position:fixed;z-index:20;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,255,255,.7))}
  .flystar{position:fixed;z-index:21;width:14px;height:14px;border-radius:50%;pointer-events:none;
    background:#fff;box-shadow:0 0 12px 4px #fff,0 0 40px 12px var(--c,#ffd98a)}
  #result{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px 26px calc(24px + var(--safe-b));background:radial-gradient(80% 60% at 50% 40%,rgba(20,26,72,.92),rgba(4,5,13,.97));backdrop-filter:blur(6px)}
  #result.on{display:flex;animation:fade .6s ease both}
  #result .big{font-family:"Mitr";font-size:64px;line-height:1;color:var(--gold);text-shadow:0 0 30px var(--gold-glow)}
  #result .big small{font-size:22px;color:var(--dim)}
  #result h2{font-size:24px;margin-top:18px;line-height:1.4}
  #result p{color:var(--dim);line-height:1.7;margin:12px 0 0;max-width:20em}
  #result .actions{width:100%;max-width:420px}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- archive ---------- */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .uni{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:20px;background:var(--card);
    border:1px solid var(--line);width:100%}
  .uni .orb{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Mitr";font-size:18px;
    background:radial-gradient(circle at 35% 30%,#2b3580,#0d1236);box-shadow:0 0 0 1px var(--line) inset}
  .uni.done .orb{background:radial-gradient(circle,#000 45%,#2a1d40 70%,#5a3d7a);box-shadow:0 0 18px -2px #7a55b0}
  .uni .meta{flex:1;min-width:0}
  .uni .meta b{font-family:"Mitr";font-weight:400;font-size:17px}
  .uni .meta div{color:var(--dim);font-size:13px;margin-top:3px}
  .tag{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .tag.live{color:var(--gold);border-color:var(--gold-glow)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
  .tile{position:relative;aspect-ratio:1;border-radius:18px;background:radial-gradient(closest-side,rgba(40,50,120,.4),rgba(10,14,40,.7));
    border:1px solid var(--line);overflow:hidden}
  .tile img{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
  .tile span{position:absolute;left:9px;top:7px;font-size:11px;color:var(--dim)}
  .empty{color:var(--dim);text-align:center;margin-top:30vh;line-height:1.8}
  .sub{color:var(--dim);font-size:14px;margin:2px 0 4px}
  #lightbox{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(3,4,12,.92);padding:24px}
  #lightbox.on{display:flex;animation:fade .3s both}
  #lightbox img{width:min(86vw,60vh);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 14px rgba(255,255,255,.45))}
  #lightbox p{color:var(--dim);margin-top:18px;font-size:14px}

  #toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);z-index:40;opacity:0;
    background:#1a2050;border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:15px;transition:.3s;
    max-width:90vw;text-align:center;pointer-events:none}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.2);border-top-color:#21170a;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="demoTag" class="demo-tag" hidden>DEMO</div>

<!-- ================= HOME ================= -->
<section id="home" class="view">
  <div class="hero">
    <div class="spark">✦</div>
    <h1>Star Universe</h1>
    <p>วาดหรือเขียนสิ่งที่อยากบอก<br>แล้วปล่อยให้มันลอยขึ้นไปเป็นดาวบนจอ</p>
    <div class="status">
      <div class="label" id="homeLabel">กำลังเชื่อมต่อจักรวาล…</div>
      <div class="dots" id="homeDots"></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn btn-primary" data-go="#/draw">✦ วาดดาวของฉัน</button>
    <button class="btn btn-ghost" data-go="#/archive">อ่านดาวที่ผ่านมา</button>
  </div>
</section>

<!-- ================= DRAW ================= -->
<section id="draw" class="view">
  <div class="topbar">
    <button class="back" data-go="#/" aria-label="กลับ">‹</button>
    <div class="title" id="drawTitle">ดาวดวงใหม่</div>
  </div>
  <div class="pad-wrap">
    <canvas id="pad"></canvas>
    <div class="pad-hint" id="padHint">ใช้นิ้ววาดหรือเขียน<br>อะไรก็ได้ตรงนี้</div>
  </div>
  <div class="tools">
    <div class="swatches" id="swatches"></div>
    <div class="tool-btns">
      <button class="tbtn" id="sizeBtn" aria-label="ขนาดเส้น">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="currentColor" id="sizeDot"/></svg></button>
      <button class="tbtn" id="undoBtn" aria-label="ย้อนกลับ">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5 3 9l4 4"/><path d="M3 9h9a5 5 0 0 1 0 10h-2"/></svg></button>
      <button class="tbtn" id="clearBtn" aria-label="ล้าง">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg></button>
    </div>
  </div>
  <div class="send-row">
    <button class="btn btn-primary" id="sendBtn" disabled>ส่งขึ้นฟ้า ✦</button>
  </div>
</section>

<div id="result">
  <div class="big" id="resBig"></div>
  <h2 id="resTitle"></h2>
  <p id="resText"></p>
  <div class="actions">
    <button class="btn btn-primary" id="againBtn">วาดอีกดวง</button>
    <button class="btn btn-ghost" data-go="#/archive">อ่านดาวที่ผ่านมา</button>
  </div>
</div>

<!-- ================= ARCHIVE ================= -->
<section id="archive" class="view">
  <div class="topbar">
    <button class="back" data-go="#/" aria-label="กลับ">‹</button>
    <div class="title"><b>ดาวที่ผ่านมา</b></div>
  </div>
  <div class="list" id="uniList"></div>
</section>

<section id="universe" class="view">
  <div class="topbar">
    <button class="back" data-go="#/archive" aria-label="กลับ">‹</button>
    <div class="title"><b id="uniTitle"></b></div>
  </div>
  <div class="sub" id="uniSub"></div>
  <div class="grid" id="uniGrid"></div>
</section>

<div id="lightbox"><img alt=""><p></p></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const CFG  = window.STAR_CONFIG || {};
const URL_ = (CFG.SUPABASE_URL || '').replace(/\/+$/, '');
const KEY  = CFG.SUPABASE_KEY || '';
const DEMO = !URL_ || !KEY;
const COLORS = ['#ffffff', '#ffd98a', '#ff9fb8', '#9fd8ff', '#b9a6ff', '#a6ffcf'];
const $ = s => document.querySelector(s);

/* ---------------- storage (safe) ---------------- */
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch { mem[k] = v; } },
};
let clientId = store.get('su_client');
if (!clientId) {
  clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
  store.set('su_client', clientId);
}

/* ---------------- API ---------------- */
async function rpc(fn, args = {}) {
  if (DEMO) return Demo[fn](args);
  const headers = { 'Content-Type': 'application/json', apikey: KEY };
  if (KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + KEY; // legacy anon key
  const r = await fetch(`${URL_}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  const text = await r.text();
  if (!r.ok) {
    let msg = text; try { msg = JSON.parse(text).message || text; } catch {}
    throw new Error(msg);
  }
  return text ? JSON.parse(text) : null;
}

/* ---------------- background sky ---------------- */
const sky = $('#sky'), sctx = sky.getContext('2d');
let skyStars = [];
function sizeSky(){
  const d = Math.min(devicePixelRatio || 1, 2);
  sky.width = innerWidth * d; sky.height = innerHeight * d;
  sctx.setTransform(d,0,0,d,0,0);
  const n = Math.round(innerWidth * innerHeight / 5500);
  skyStars = Array.from({length:n}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:Math.random()*1.1+.2, p:Math.random()*6.28, s:Math.random()*.8+.3}));
}
function drawSky(t){
  sctx.clearRect(0,0,innerWidth,innerHeight);
  for (const s of skyStars){
    const a = .25 + .75 * (.5 + .5*Math.sin(t/1000*s.s + s.p));
    sctx.globalAlpha = a; sctx.fillStyle = '#dfe4ff';
    sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.283); sctx.fill();
  }
  sctx.globalAlpha = 1;
  requestAnimationFrame(drawSky);
}
addEventListener('resize', sizeSky); sizeSky(); requestAnimationFrame(drawSky);

/* ---------------- toast ---------------- */
let toastT;
function toast(msg, ms = 2800){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms);
}

/* ---------------- router ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) location.hash = b.dataset.go;
});
function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  window.scrollTo(0,0);
}
async function route(){
  const h = location.hash || '#/';
  $('#result').classList.remove('on'); $('#lightbox').classList.remove('on');
  let m;
  if (h === '#/draw') { show('draw'); enterDraw(); }
  else if (h === '#/archive') { show('archive'); loadArchive(); }
  else if ((m = h.match(/^#\/u\/(\d+)$/))) { show('universe'); loadUniverse(+m[1]); }
  else { show('home'); loadHome(); }
}
addEventListener('hashchange', route);

/* ---------------- home ---------------- */
let state = null;
async function refreshState(){
  try { state = await rpc('get_state'); } catch (e) { console.warn(e); }
  return state;
}
async function loadHome(){
  const s = await refreshState();
  if (!s) { $('#homeLabel').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; return; }
  $('#homeLabel').innerHTML = `จักรวาลที่ <b>${s.current_universe}</b> · ดาว <b>${s.star_count}</b> / ${s.star_target} ดวง`;
  $('#homeDots').innerHTML = Array.from({length:s.star_target}, (_,i) => `<i class="${i < s.star_count ? 'lit' : ''}"></i>`).join('');
}
setInterval(() => { if ($('#home').classList.contains('on')) loadHome(); }, 6000);

/* ---------------- drawing pad ---------------- */
const pad = $('#pad'), pctx = pad.getContext('2d');
const base = document.createElement('canvas'), bctx = base.getContext('2d'); // committed strokes
const SIZES = [0.012, 0.022, 0.04];                 // line width as fraction of pad size
let strokes = [], cur = null, color = COLORS[0], sizeI = 1, padW = 0, dirty = false, sending = false;

$('#swatches').innerHTML = COLORS.map((c,i) =>
  `<button class="sw${i?'':' on'}" style="background:${c};color:${c}" data-c="${c}" aria-label="สี ${i+1}"></button>`).join('');
$('#swatches').addEventListener('click', e => {
  const b = e.target.closest('.sw'); if (!b) return;
  color = b.dataset.c;
  document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b));
});
$('#sizeBtn').addEventListener('click', () => {
  sizeI = (sizeI + 1) % SIZES.length;
  $('#sizeDot').setAttribute('r', [2, 3.5, 6][sizeI]);
});
$('#undoBtn').addEventListener('click', () => { strokes.pop(); renderBase(); });
$('#clearBtn').addEventListener('click', () => { strokes = []; renderBase(); });

function sizePad(){
  const r = pad.getBoundingClientRect(); if (!r.width) return;
  const d = Math.min(devicePixelRatio || 1, 3);
  padW = r.width;
  pad.width = base.width = Math.round(r.width * d);
  pad.height = base.height = Math.round(r.height * d);
  renderBase();
}
new ResizeObserver(sizePad).observe(pad);

// draw one stroke (points normalized 0..1) onto ctx of pixel size S
function pathStroke(ctx, st, S){
  const p = st.pts;
  ctx.strokeStyle = st.c; ctx.fillStyle = st.c;
  ctx.lineWidth = st.w * S; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0]*S, p[0][1]*S, st.w*S/2, 0, 6.283); ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(p[0][0]*S, p[0][1]*S);
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i][0] + p[i+1][0]) / 2, my = (p[i][1] + p[i+1][1]) / 2;
    ctx.quadraticCurveTo(p[i][0]*S, p[i][1]*S, mx*S, my*S);
  }
  const l = p[p.length-1]; ctx.lineTo(l[0]*S, l[1]*S); ctx.stroke();
}
function glowStroke(ctx, st, S){
  ctx.save(); ctx.shadowColor = st.c; ctx.shadowBlur = S * 0.02; pathStroke(ctx, st, S); ctx.restore();
}
function renderBase(){
  bctx.clearRect(0,0,base.width,base.height);
  for (const st of strokes) glowStroke(bctx, st, base.width);
  dirty = true; updateUI();
}
function frame(){
  if (dirty) {
    pctx.clearRect(0,0,pad.width,pad.height);
    pctx.drawImage(base, 0, 0);
    if (cur) glowStroke(pctx, cur, pad.width);
    dirty = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function inkLength(){
  let L = 0;
  for (const st of strokes) { L += st.w; for (let i=1;i<st.pts.length;i++) L += Math.hypot(st.pts[i][0]-st.pts[i-1][0], st.pts[i][1]-st.pts[i-1][1]); }
  return L;
}
function updateUI(){
  $('#sendBtn').disabled = sending || inkLength() < 0.08;
  $('#padHint').classList.toggle('gone', strokes.length > 0 || !!cur);
}

// typing signal -> TouchDesigner (Phase 2)
let lastPing = 0;
function pingTyping(){
  const now = Date.now(); if (now - lastPing < 2500) return;
  lastPing = now; rpc('ping_typing').catch(() => {});
}

let activeId = null;
function ptr(e){ const r = pad.getBoundingClientRect(); return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height]; }
pad.addEventListener('pointerdown', e => {
  if (activeId !== null || sending) return;
  activeId = e.pointerId; pad.setPointerCapture(e.pointerId);
  cur = { c: color, w: SIZES[sizeI], pts: [ptr(e)] };
  dirty = true; updateUI(); pingTyping();
});
pad.addEventListener('pointermove', e => {
  if (e.pointerId !== activeId || !cur) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) {
    const p = ptr(ev), q = cur.pts[cur.pts.length-1];
    if (Math.hypot(p[0]-q[0], p[1]-q[1]) > 0.002) cur.pts.push(p);
  }
  dirty = true; pingTyping();
});
function endStroke(e){
  if (e.pointerId !== activeId) return;
  activeId = null;
  if (cur) { strokes.push(cur); cur = null; renderBase(); }
}
pad.addEventListener('pointerup', endStroke);
pad.addEventListener('pointercancel', endStroke);

// export: crop to drawing, fit into 512x512 transparent PNG, no glow (ให้ TD ใส่ glow เอง)
function exportPNG(list = strokes, OUT = 512){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const st of list) for (const [x,y] of st.pts) {
    x0=Math.min(x0,x-st.w/2); y0=Math.min(y0,y-st.w/2); x1=Math.max(x1,x+st.w/2); y1=Math.max(y1,y+st.w/2);
  }
  const w = x1-x0, h = y1-y0, scale = Math.min(OUT*0.88/Math.max(w,h,1e-6), OUT*3);
  const c = document.createElement('canvas'); c.width = c.height = OUT;
  const ctx = c.getContext('2d');
  ctx.translate(OUT/2 - (x0+w/2)*scale, OUT/2 - (y0+h/2)*scale);
  for (const st of list) pathStroke(ctx, st, scale);
  return c.toDataURL('image/png');
}

/* ---------------- cooldown ---------------- */
function cooldownLeft(){
  const last = +store.get('su_last') || 0, cd = (state && state.cooldown_seconds) || 0;
  return Math.max(0, Math.ceil((last + cd*1000 - Date.now())/1000));
}

async function enterDraw(){
  requestAnimationFrame(sizePad);
  const s = await refreshState();
  $('#drawTitle').innerHTML = s ? `ดาวดวงที่ <b>${s.star_count + 1}</b> / ${s.star_target} · จักรวาลที่ ${s.current_universe}` : 'ดาวดวงใหม่';
}

$('#sendBtn').addEventListener('click', async () => {
  if (sending || !strokes.length) return;
  const left = cooldownLeft();
  if (left > 0) { toast(`รออีก ${left} วินาที ก่อนส่งดาวดวงใหม่นะ`); return; }
  sending = true; updateUI();
  const btn = $('#sendBtn'); btn.innerHTML = '<span class="spin"></span>';
  const dataUrl = exportPNG();
  const mainColor = strokes[strokes.length-1].c;
  try {
    const res = await rpc('submit_star', { p_image: dataUrl.split(',')[1], p_color: mainColor, p_client_id: clientId });
    store.set('su_last', Date.now());
    await flyAway(mainColor);
    strokes = []; renderBase();
    showResult(res);
  } catch (e) {
    const m = String(e.message || e).match(/COOLDOWN:(\d+)/);
    if (m) { store.set('su_last', Date.now() - ((state?.cooldown_seconds||30) - +m[1])*1000); toast(`รออีก ${m[1]} วินาที ก่อนส่งดาวดวงใหม่นะ`); }
    else { console.error(e); toast('ส่งไม่สำเร็จ ลองใหม่อีกครั้งนะ'); }
  } finally {
    sending = false; btn.textContent = 'ส่งขึ้นฟ้า ✦'; updateUI();
  }
});

// the drawing shrinks into a star and flies up (mirrors what happens on the big screen)
function flyAway(c){
  return new Promise(resolve => {
    const r = pad.getBoundingClientRect();
    const img = document.createElement('canvas'); img.width = pad.width; img.height = pad.height;
    img.getContext('2d').drawImage(base, 0, 0);
    Object.assign(img.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
    img.className = 'fly'; document.body.appendChild(img);
    pctx.clearRect(0,0,pad.width,pad.height); bctx.clearRect(0,0,base.width,base.height);
    const a1 = img.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.04)',opacity:.9}],
      {duration:900,easing:'cubic-bezier(.6,0,.3,1)',fill:'forwards'});
    a1.onfinish = () => {
      img.remove();
      const s = document.createElement('div'); s.className = 'flystar'; s.style.setProperty('--c', c);
      s.style.left = (r.left + r.width/2 - 7) + 'px'; s.style.top = (r.top + r.height/2 - 7) + 'px';
      document.body.appendChild(s);
      const a2 = s.animate([{transform:'translateY(0) scale(1)',opacity:1},{transform:`translateY(${-r.top-r.height/2-40}px) scale(.4)`,opacity:0}],
        {duration:1100,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'});
      a2.onfinish = () => { s.remove(); resolve(); };
    };
  });
}

let cdTimer;
function showResult(res){
  $('#resBig').innerHTML = `${res.star_index}<small> / ${res.star_target}</small>`;
  if (res.is_last) {
    $('#resTitle').textContent = 'คุณคือดาวดวงสุดท้าย';
    $('#resText').textContent = `จักรวาลที่ ${res.universe_id} เต็มแล้ว มองขึ้นไปที่จอ หลุมดำกำลังจะกำเนิด และจักรวาลใหม่จะเริ่มต้นอีกครั้ง`;
  } else {
    $('#resTitle').textContent = 'ดาวของคุณกำลังเกิด';
    $('#resText').textContent = `ดวงที่ ${res.star_index} ของจักรวาลที่ ${res.universe_id} มองขึ้นไปที่จอสิ ✦`;
  }
  $('#result').classList.add('on');
  const btn = $('#againBtn');
  clearInterval(cdTimer);
  const tick = () => {
    const left = cooldownLeft();
    btn.disabled = left > 0;
    btn.textContent = left > 0 ? `วาดอีกดวงได้ใน ${left} วิ` : 'วาดอีกดวง';
    if (!left) clearInterval(cdTimer);
  };
  tick(); cdTimer = setInterval(tick, 500);
}
$('#againBtn').addEventListener('click', () => { $('#result').classList.remove('on'); enterDraw(); });

/* ---------------- archive ---------------- */
const fmtD = d => new Date(d).toLocaleDateString('th-TH', {day:'numeric', month:'short'});
const fmtT = d => new Date(d).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadArchive(){
  const el = $('#uniList'); el.innerHTML = '<div class="empty">กำลังโหลด…</div>';
  try {
    const list = await rpc('list_universes');
    if (!list.length) { el.innerHTML = '<div class="empty">ยังไม่มีดาวเลย<br>มาเป็นดาวดวงแรกกัน ✦</div>'; return; }
    el.innerHTML = list.map(u => `
      <button class="uni ${u.complete ? 'done' : ''}" data-go="#/u/${u.universe_id}">
        <div class="orb">${u.universe_id}</div>
        <div class="meta"><b>จักรวาลที่ ${u.universe_id}</b>
          <div>${u.stars} ดวง · ${fmtD(u.started_at)} ${fmtT(u.started_at)}–${fmtT(u.ended_at)}</div></div>
        <span class="tag ${u.complete ? '' : 'live'}">${u.complete ? 'ถูกหลุมดำกลืนแล้ว' : 'กำลังก่อตัว'}</span>
      </button>`).join('');
  } catch (e) { console.error(e); el.innerHTML = '<div class="empty">โหลดไม่สำเร็จ ลองใหม่อีกครั้ง</div>'; }
}

let uniStars = [];
async function loadUniverse(n){
  $('#uniTitle').textContent = `จักรวาลที่ ${n}`;
  $('#uniSub').textContent = ''; const g = $('#uniGrid'); g.innerHTML = '';
  try {
    uniStars = await rpc('get_universe_stars', { p_universe: n });
    $('#uniSub').textContent = `${uniStars.length} ดวง · แตะเพื่อดูใกล้ๆ`;
    g.innerHTML = uniStars.map((s,i) => `
      <button class="tile" data-i="${i}"><span>#${s.star_index}</span>
        <img loading="lazy" alt="ดาวดวงที่ ${s.star_index}" src="data:image/png;base64,${esc(s.image)}"></button>`).join('');
  } catch (e) { console.error(e); g.innerHTML = '<div class="empty">โหลดไม่สำเร็จ</div>'; }
}
$('#uniGrid').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const s = uniStars[+t.dataset.i], lb = $('#lightbox');
  lb.querySelector('img').src = 'data:image/png;base64,' + s.image;
  lb.querySelector('p').textContent = `ดาวดวงที่ ${s.star_index} · ${fmtD(s.created_at)} ${fmtT(s.created_at)}`;
  lb.classList.add('on');
});
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('on'));

/* ---------------- DEMO backend (ใช้เมื่อยังไม่ใส่ config) ---------------- */
const Demo = (() => {
  const st = { current_universe: 1, star_count: 0, star_target: 20, cooldown_seconds: 5 };
  const stars = []; let id = 0;
  const wait = v => new Promise(r => setTimeout(() => r(v), 250));
  function scribble(seed){
    let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const c = COLORS[Math.floor(rnd()*COLORS.length)], list = [];
    for (let k = 0, n = 1 + Math.floor(rnd()*3); k < n; k++) {
      const pts = []; let x = .3+rnd()*.4, y = .3+rnd()*.4, a = rnd()*6.28;
      for (let i = 0; i < 40; i++) { a += (rnd()-.5)*.9; x += Math.cos(a)*.02; y += Math.sin(a)*.02; pts.push([x,y]); }
      list.push({ c, w: .025, pts });
    }
    return { c, img: exportPNG(list, 256).split(',')[1] };
  }
  function add(image, color, client){
    const now = new Date(Date.now() - (60 - id) * 60000).toISOString();
    const row = { id: ++id, universe_id: st.current_universe, star_index: st.star_count + 1, color, image, client, created_at: now };
    stars.push(row);
    if (row.star_index >= st.star_target) { st.current_universe++; st.star_count = 0; } else st.star_count++;
    return row;
  }
  for (let i = 0; i < 27; i++) { const d = scribble(i+1); add(d.img, d.c, 'seed'); }
  const fixTime = r => (r.created_at = r.created_at, r);
  return {
    get_state: () => wait({ ...st }),
    ping_typing: () => wait(null),
    submit_star({ p_image, p_color, p_client_id }){
      const last = stars.filter(s => s.client === p_client_id).pop();
      if (last && Date.now() - Date.parse(last.created_at) < st.cooldown_seconds*1000)
        return Promise.reject(new Error('COOLDOWN:' + Math.ceil((Date.parse(last.created_at) + st.cooldown_seconds*1000 - Date.now())/1000)));
      const target = st.star_target, r = add(p_image, p_color, p_client_id);
      r.created_at = new Date().toISOString(); fixTime(r);
      return wait({ id: r.id, universe_id: r.universe_id, star_index: r.star_index, star_target: target, is_last: r.star_index >= target });
    },
    list_universes(){
      const by = {};
      for (const s of stars) (by[s.universe_id] ||= []).push(s);
      return wait(Object.keys(by).map(Number).sort((a,b) => b-a).map(u => ({
        universe_id: u, stars: by[u].length, started_at: by[u][0].created_at,
        ended_at: by[u][by[u].length-1].created_at, complete: u < st.current_universe })));
    },
    get_universe_stars: ({ p_universe }) => wait(stars.filter(s => s.universe_id === p_universe)),
  };
})();
if (DEMO) $('#demoTag').hidden = false;

route();
})();
